<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <title>Travel Agency</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="fondo-crema">
   <header class="p-4 is-flex is-align-items-center is-justify-content-space-between headercf">
    <div class="dropdown is-hoverable">
    <div class="dropdown-trigger">
    <button class="button btn-cafe is-outlined" aria-haspopup="true" aria-controls="dropdown-menu">
    <span>Menu</span></button></div>

    <div class="dropdown-menu" id="dropdown-menu" role="menu">
    <div class="dropdown-content">
        <a href="Main.html" class="dropdown-item">Main Page</a>
        <a href="Profile.html" class="dropdown-item">Profile</a>
        <a href="login.html" class="dropdown-item">Log out</a>
    </div></div></div>

    <div class="is-flex is-align-items-center">
        <img src="img/logo.png" alt="Logo" class="LogoAgencia">
    </div>

    <a href="Profile.html">
        <img src="src/Usuario.jpg" alt="Profile" class="PerfilImg">
    </a>
</header>

<main class="section">
<div class="container is-max-desktop">
<div class="columns is-variable is-6">

<div class="column is-7">
<!-- SECCIÓN A1: Info del Destino -->
<div id="seccion-a1" class="box caja-info-boutique mb-5 is-relative">

</div>

<!-- SECCIÓN A2: Paquetes de viaje -->
<h3 class="title is-4 mb-4 texto-espresso">Travel pack options</h3>
<div id="seccion-a2" class="columns is-multiline">

</div>
</div>

<div class="column is-5">
<div class="box p-5 caja-clima-boutique">
<h3 class="title is-4 has-text-centered texto-crema mb-4">7-Day Forecast</h3>
<div class="clima-carrusel" id="carrusel-pronostico">
<!-- JS inyectará los 7 días aquí -->
</div>
</div>
</div>

</div></div></main>

<div id="modal-reserva" class="modal">
<div class="modal-background" onclick="cerrarModal()"></div>
<div class="modal-content">
<div class="box modal-boutique has-text-centered p-6">
<h3 class="title is-3 texto-espresso">You want to add this trip?</h3>
<p id="modal-nombre-paquete" class="is-size-5 mb-5 texto-cafe-oscuro"></p>
<div class="buttons is-centered mt-4">
<button class="button btn-cancelar is-medium" onclick="cerrarModal()">No</button>
<button class="button btn-cafe-solido is-medium" onclick="confirmarReserva()">Yes</button>
</div></div></div></div>

<script>


// MOCK API PRONOSTICO DE 7 DÍAS

const mockPronostico = [
{ dia: "Monday", temp: "28°C", desc: "Sunny and clear" },
{ dia: "Tuesday", temp: "29°C", desc: "Mostly sunny" },
{ dia: "Wednesday", temp: "27°C", desc: "Partly cloudy" },
{ dia: "Thursday", temp: "25°C", desc: "Light rain" },
{ dia: "Friday", temp: "26°C", desc: "Clearing up" },
{ dia: "Saturday", temp: "30°C", desc: "Perfect beach day" },
{ dia: "Sunday", temp: "29°C", desc: "Sunny and warm" }
];
function renderizarPronostico() {
const contenedor = document.getElementById('carrusel-pronostico');
const datosInfinitos = [...mockPronostico, ...mockPronostico];
contenedor.innerHTML = datosInfinitos.map((clima) => `
<div class="tarjeta-clima-fila is-flex is-justify-content-space-between is-align-items-center">
<span class="has-text-weight-bold texto-espresso is-size-5">${clima.dia}</span>
<div class="has-text-right">
<span class="texto-terracota has-text-weight-bold is-size-4 is-block">${clima.temp}</span>
<span class="texto-cafe-oscuro is-size-7">${clima.desc}</span>
</div>
</div>
`).join('');
}
function iniciarCarruselPronostico() {
const contenedor = document.getElementById('carrusel-pronostico');
let scrollPos = 0;
setInterval(() => {
if (!contenedor.children[0]) return;
const alturaTarjeta = contenedor.children[0].offsetHeight + 16;
scrollPos += alturaTarjeta;
if (scrollPos >= contenedor.scrollHeight / 2) {
contenedor.style.scrollBehavior = 'auto';
contenedor.scrollTop = 0;
scrollPos = alturaTarjeta;
setTimeout(() => contenedor.style.scrollBehavior = 'smooth', 50);
}
contenedor.scrollTop = scrollPos;
}, 2500);
}
renderizarPronostico();
setTimeout(iniciarCarruselPronostico, 500);

// MOCK API DESTINOS Y PAQUETES DE VIAJE
const bdDestinos = {
1: { nombre: "Balandra Beach", ubicacion: "Baja California Sur, México", estrellas: "5-Star Rating", desc: "Famous for its shallow, crystal-clear waters and the 'Mushroom' rock formation.", paquetes: [{ package_id: 101, package_name: "Basic Getaway", price: 300.00, duration_days: 2, description: "1 Night Hostel, basic meals included.", transport: "Bus" }, { package_id: 102, package_name: "Standard Tour", price: 600.00, duration_days: 4, description: "3 Nights Hotel, guided tours and breakfast.", transport: "Commercial Flight" }, { package_id: 103, package_name: "Premium Experience", price: 1250.00, duration_days: 6, description: "5 Nights Resort, all inclusive VIP access.", transport: "First Class Flight" }]},
2: { nombre: "Bora Bora", ubicacion: "French Polynesia", estrellas: "4-Star Rating", desc: "The classic luxury destination with bungalows over turquoise waters.", paquetes: [{ package_id: 201, package_name: "Economy Pack", price: 1000.00, duration_days: 4, description: "3 Nights hotel stay.", transport: "Commercial Flight" }, { package_id: 202, package_name: "Comfort Pack", price: 2500.00, duration_days: 6, description: "5 Nights Resort + Island Tours.", transport: "Commercial Flight" }, { package_id: 203, package_name: "Luxury Escape", price: 5000.00, duration_days: 7, description: "Overwater Bungalow full experience.", transport: "Private Jet" }]}
};

const urlParams = new URLSearchParams(window.location.search);
const destinoId = urlParams.get('id') || 1;
const destinoActual = bdDestinos[destinoId];
let paqueteSeleccionadoTemporal = null;
 
document.getElementById('seccion-a1').innerHTML = `
<h1 class="title is-2 mb-1 texto-espresso">${destinoActual.nombre}</h1>
<p class="mb-3 texto-terracota has-text-weight-semibold">${destinoActual.ubicacion} | ${destinoActual.estrellas}</p>
<p class="texto-cafe-oscuro" style="line-height: 1.6;">${destinoActual.desc}</p>
<button id="btn-fav" class="btn-favorito" onclick="toggleFavorito()" title="Save as favorite">★</button>
`;


document.getElementById('seccion-a2').innerHTML = destinoActual.paquetes.map(p => `
<div class="column is-4">
<div class="box tarjeta-paquete has-text-centered" onclick="abrirModal('${p.package_name}', ${p.price})">
<h4 class="title is-5 mb-3 texto-espresso">${p.package_name}</h4>
<h5 class="subtitle is-3 texto-terracota has-text-weight-bold mb-4">$${p.price}</h5>
<div class="info-paquete mb-4">
    <p class="is-size-7 texto-cafe-oscuro"><strong>Duration:</strong> ${p.duration_days} Days</p>
    <p class="is-size-7 texto-cafe-oscuro"><strong>Transport:</strong> ${p.transport}</p>
</div>
<p class="is-size-7 texto-cafe-oscuro descripcion-paquete">${p.description}</p>
<button class="button btn-cafe-solido is-small is-fullwidth mt-4">Select</button>
</div></div>
`).join('');

function abrirModal(nombrePaquete, precio) { paqueteSeleccionadoTemporal = `${destinoActual.nombre} - ${nombrePaquete} ($${precio})`; document.getElementById('modal-nombre-paquete').innerHTML = paqueteSeleccionadoTemporal; document.getElementById('modal-reserva').classList.add('is-active'); }
function cerrarModal() { document.getElementById('modal-reserva').classList.remove('is-active'); paqueteSeleccionadoTemporal = null; }


async function confirmarReserva() {
    // 1. Preparas los datos que tu tabla MySQL necesita
    const datosReserva = {

        paquete_id: idDelPaqueteSeleccionado, 
        fecha_reserva: new Date().toISOString(),
        estado: 'Pending'
    };

    try {
        // 2. Tocas la puerta de tu API con 'fetch'
        const respuesta = await fetch('http://localhost:3000/api/reservations', {
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datosReserva) 
        });

        
        if (respuesta.ok) {
            alert("Trip added to your database successfully!");
            cerrarModal();
            window.location.href = "Profile.html"; 
        } else {
            alert("Hubo un error al guardar en la base de datos.");
        }
    } catch (error) {
        console.error("Fallo la conexión con el servidor:", error);
    }
}

async function toggleFavorito() {
    const btn = document.getElementById('btn-fav');
    const esFavorito = btn.classList.contains('activo');
    const metodoHttp = esFavorito ? 'DELETE' : 'POST';

    try {
        const respuesta = await fetch(`http://localhost:3000/api/favorites`, {
            method: metodoHttp,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuario_id: 1, destino_id: destinoId })
        });

        if(respuesta.ok) {
            btn.classList.toggle('activo');
        }
    } catch (error) {
        console.log("No se pudo conectar con la API");
    }
}

const carrusel = document.getElementById('CarruselAuto');
setInterval(() => { const scrollMaximo = carrusel.scrollWidth - carrusel.clientWidth; if (carrusel.scrollLeft >= scrollMaximo - 1) { carrusel.scrollLeft = 0; } else { carrusel.scrollLeft += carrusel.clientWidth;} }, 3000);
</script>
</body>
</html>
