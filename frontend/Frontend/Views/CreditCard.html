<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Credit Card</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<class="fondo-crema">
    <!-- SLIDE MENU OCULTO -->
    <div id="slide-menu" class="slide-menu-boutique p-5">
        <button class="delete is-large is-pulled-right mb-5" aria-label="close" onclick="toggleMenu()"></button>
        <div class="is-clearfix"></div>
        <h2 class="title is-4 texto-espresso mb-5" style="border-bottom: 2px solid #DCD3C6; padding-bottom: 10px;">Menu</h2>
        <ul class="menu-list mt-2">
            <li><a href="Main.html" class="is-size-5 texto-espresso py-3 mb-2">Home</a></li>
            <li><a href="Profile.html" class="is-size-5 texto-espresso py-3 mb-2">Profile</a></li>
            <li><a href="GuiasInfo.html" class="is-size-5 texto-espresso py-3 mb-2">Guides</a></li>
            <li><a href="login.html" class="is-size-5 texto-terracota py-3 mt-5 has-text-weight-bold">Log out</a></li>
        </ul>
    </div>
    
    <!-- OVERLAY OSCURO (Al hacer clic afuera, se cierra el menú) -->
    <div id="menu-overlay" class="menu-overlay" onclick="toggleMenu()"></div>

    <!-- HEADER PRINCIPAL -->
    <header class="p-4 is-flex is-align-items-center is-justify-content-space-between headercf">
        <!-- Botón Menú -->
        <div style="width: 80px;">
            <button class="button btn-cafe is-outlined" onclick="toggleMenu()">
                <span>Menu</span>
            </button>
        </div>
        
        <!-- Logo Centrado -->
        <div class="is-flex is-justify-content-center" style="flex-grow: 1;">
            <img src="src/LogoMain.png" alt="Logo" class="logo-boutique">
        </div>
        
        <!-- Icono Perfil -->
        <div style="width: 80px; text-align: right;">
            <a href="Profile.html" style="display: inline-block;">
                <svg viewBox="0 0 24 24" class="icono-perfil-boutique" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="7" r="5" />
                  <path d="M4 21v-1c0-3.866 3.134-7 7-7h2c3.866 0 7 3.134 7 7v1H4z" />
                </svg>
            </a>
        </div>
    </header>

    <main class="section">
        <div class="container is-max-desktop">
            <div class="columns is-centered mt-5">
                <div class="column is-6">
                    <div class="box p-5 caja-centrada-boutique">

                        <h1 class="title is-4 has-text-centered mb-5 texto-espresso">Add New Credit Card</h1>
                        <form id="cardForm">

                            <div class="field mb-4">
                                <label for="card-owner" class="label texto-espresso">Owner Name</label>
                                <div class="control">
                                    <input id="card-owner" name="owner_name" class="input input-boutique" type="text"
                                        placeholder="Name on card" required>
                                </div>
                            </div>

                            <div class="field mb-4">
                                <label for="card-number" class="label texto-espresso">Card Number</label>
                                <div class="control">
                                    <input id="card-number" name="account_number" class="input input-boutique"
                                        type="text" placeholder="XXXX XXXX XXXX XXXX" maxlength="19" required>
                                </div>
                            </div>

                            <div class="columns is-mobile">
                                <div class="column is-6">
                                    <div class="field">
                                        <label for="card-exp" class="label texto-espresso">Expiration Date</label>
                                        <div class="control">
                                            <input id="card-exp" name="expiration_date" class="input input-boutique"
                                                type="month" required>
                                        </div>
                                    </div>
                                </div>

                                <div class="column is-6">
                                    <div class="field">
                                        <label for="card-cvv" class="label texto-espresso">CVV</label>
                                        <div class="control">
                                            <input id="card-cvv" name="cvv" class="input input-boutique" type="password"
                                                placeholder="XXX" maxlength="4" required>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="is-flex is-justify-content-space-between mt-5">
                                <a href="Profile.html" class="button btn-cancelar">Cancel</a>
                                <button type="submit" class="button btn-cafe-solido">Save Card</button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- FOOTER BOUTIQUE -->
    <footer class="footer pb-4 pt-5 is-shadowless" style="background-color: transparent;">
        <div class="content has-text-centered">
            <p class="is-size-7 texto-cafe-oscuro" style="letter-spacing: 1px;">
                &copy; 2026 Travel Agency Boutique. All rights reserved.
            </p>
        </div>
    </footer>
    <script>

       const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        document.getElementById('cardForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const cardNumber = document.getElementById('card-number').value.replace(/\s/g, ''); // quita espacios

            try {
                const response = await fetch('http://localhost:8080/api/cards', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        ownerName: document.getElementById('card-owner').value,
                        accountNumber: cardNumber,
                        expirationDate: document.getElementById('card-exp').value,
                        cvv: document.getElementById('card-cvv').value
                    })
                });

                if (response.ok) {
                    alert('Card added successfully!');
                    window.location.href = 'Profile.html';
                } else {
                    const error = await response.json();
                    alert(error.message || 'Error adding card');
                }
            } catch (error) {
                alert('Error connecting to server');
            }
        });
        function toggleMenu() {
        document.getElementById('slide-menu').classList.toggle('is-active');
        document.getElementById('menu-overlay').classList.toggle('is-active');
    }
    </script>

    </body>
    

</html>
