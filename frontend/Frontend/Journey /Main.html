<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <title>Travel Agency</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="has-background-info-light p-4 is-flex is-align-items-center is-justify-content-space-between">
        <div class="dropdown is-hoverable">
        <div class="dropdown-trigger">
        <button class="button is-info is-outlined" aria-haspopup="true" aria-controls="dropdown-menu">
        <span>Menu</span></button></div>

        <div class="dropdown-menu" id="dropdown-menu" role="menu">
        <div class="dropdown-content">
            <a href="Main.html" class="dropdown-item">Main Page</a>
            <a href="Profile.html" class="dropdown-item">Profile</a>
            <a href="login.html" class="dropdown-item">Log out</a>
        </div></div></div>

        <div class="is-flex is-align-items-center">
            <img src="img/" alt="Logo" class="LogoAgencia">
        </div>

        <a href="Profile.html">
            <img src="src/Usuario.jpg" alt="Profile" class="PerfilImg">
        </a>
    </header>
<main class="section">
<div class="container is-max-desktop">
<div class="columns is-variable is-6">  
<div class="column is-7 ColumnaScroll">  

<div class="field mb-5">
<div class="control">
<input id="buscador-destinos" name="search" class="input is-medium has-background-info-light" type="text" placeholder="Search destinations...">
</div>
</div>

<div id="contenedor-destinos" class="columns is-multiline"> 
</div></div>

<div class="column is-5">
<div class="box p-0 CajaCarrusel">
<div class="CarruselContenedor" id="CarruselAuto">
<img src="src/Ciudad.jpeg" alt="Ciudad" class="CarruselImg">
<img src="src/Nevado.jpeg" alt="Nevado" class="CarruselImg">
<img src="src/Bosque.jpeg" alt="Bosque" class="CarruselImg">
<img src="src/nuebayol.jpeg" alt="Ciudad2" class="CarruselImg">
<img src="src/CiudadEuro.jpeg" alt="Lugar" class="CarruselImg">
</div></div></div>

</div>
</main>
<script>
// Base feik
const destinos = [{id:1, img:"src/Balandra.jpg", name:"Balandra Beach", desc:"Famous for its shallow, crystal-clear waters and the 'Mushroom' rock formation.(Baja California Sur, México)"}, {id:2, img:"src/Bora.jpeg", name:"Bora Bora", desc:"The classic luxury destination with bungalows over turquoise waters. (French Polynesia)"}, {id:3, img:"src/Tulum.jpeg", name:"Tulum", desc:"Perfect for showcasing the combination of white sand and Mayan ruins.(Quintana Roo, México)"}, {id:4, img:"src/Navagio.jpeg", name:"Navagio Beach", desc:"Known for the ship beached on the sand, surrounded by towering cliffs.(Zakynthos Island, Greece)"}, {id:5, img:"src/Whiteheaven.jpeg", name:"Whitehaven Beach", desc:"Famous for its swirls of brilliant white sand and blue water.(Australia)"}, {id:6, img:"src/Anse.jpeg", name:"Anse Source d'Argent", desc:"Ideal for showcasing exotic landscapes with giant granite rocks.(Seychelles)"}, {id:7, img:"src/Maya.jpeg", name:"Maya Bay", desc:"A spectacular bay surrounded by green mountains.(Thailand)"}, {id:8, img:"src/Copacabana.jpeg", name:"Copacabana", desc:"Excellent if you want to showcase a beach destination with a vibrant urban atmosphere and plenty of activity.(Rio de Janeiro, Brazil)"}];

// Inyección
document.getElementById('contenedor-destinos').innerHTML = destinos.map(d => `<div class="column is-6"><a href="journey.html?id=${d.id}" class="box is-paddingless has-background-info-light TarjetaDestino"><img src="${d.img}" alt="Place" class="ImagenDestino"><div class="p-3 has-text-centered"><p class="has-text-dark is-size-7"><strong>${d.name}</strong> ${d.desc}</p></div></a></div>`).join('');
</script>
<script>
const carrusel = document.getElementById('CarruselAuto');
setInterval(() => {        
const scrollMaximo = carrusel.scrollWidth - carrusel.clientWidth;        
if (carrusel.scrollLeft >= scrollMaximo - 1) {
carrusel.scrollLeft = 0;
} else {
carrusel.scrollLeft += carrusel.clientWidth;} }, 3000); 
</script>
</body>
</html>
